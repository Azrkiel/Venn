app = "venn-app"
primary_region = "iad"

[deploy]
  release_command = "npx prisma migrate deploy"

# Non-secret configuration. Credentials are set with `fly secrets set`, never committed.
[env]
  NODE_ENV = "production"
  APP_BASE_URL = "https://venn-app.fly.dev"
  AUTH_URL = "https://venn-app.fly.dev"
  AUTH_TRUST_HOST = "true"
  GOOGLE_CALENDAR_REDIRECT_URI = "https://venn-app.fly.dev/api/calendar/callback"
  GEMINI_MODEL = "gemini-3.5-flash"
  IMESSAGE_LOCAL = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # One machine stays warm so Photon webhooks and OAuth callbacks never wait on a cold start.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/app"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
