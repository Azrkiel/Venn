name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: venn
          POSTGRES_PASSWORD: venn
          POSTGRES_DB: venn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U venn -d venn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://venn:venn@127.0.0.1:5432/venn
      DIRECT_URL: postgresql://venn:venn@127.0.0.1:5432/venn
      APP_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
